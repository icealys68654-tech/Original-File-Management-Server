name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: lukka/get-cmake@latest
      - name: Node MVC syntax and regression tests
        run: cd mvc && node --check server.mjs && node --check public/app.js && node --check public/preview.js && node --test
      - name: Go umbrella unit tests
        run: go test ./...
      - name: Go umbrella validation and regression workflow
        run: go run ./cmd/umbrella full
      - name: Configure CMake umbrella
        run: cmake -S . -B build
      - name: Build CMake validation umbrella
        run: cmake --build build --target ci-validate
      - name: Start app and run CI smoke probe
        shell: bash
        env:
          CIS_HOST: 127.0.0.1
          CIS_PORT: '5080'
          CFS_ADMIN_EMAIL: ci-admin@example.test
          CFS_ADMIN_PASSWORD: ci-only-password-not-for-production
          CFS_DB_PATH: ${{ runner.temp }}/cfs-ci.sqlite
          CFS_STORAGE_PATH: ${{ runner.temp }}/cfs-storage
          CFS_AUDIT_PATH: ${{ runner.temp }}/cfs-audit.jsonl
          CFS_BASE_URL: http://127.0.0.1:5080
        run: |
          node mvc/server.mjs > "$RUNNER_TEMP/cfs-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail "$CFS_BASE_URL/health" >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/cfs-server.log"
            echo "Application did not become healthy within 30 seconds"
            exit 1
          fi
          go run ./cmd/umbrella smoke
