# Install as /etc/nginx/conf.d/cfs.conf; replace the hostname and certificate paths.
# The Node application must bind only to 127.0.0.1:5080.
limit_req_zone $binary_remote_addr zone=cfs_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=cfs_per_ip:10m;
limit_conn_zone $server_name zone=cfs_global:10m;
server_tokens off;
proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

server {
    listen 80;
    listen [::]:80;
    server_name cfs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cfs.example.com;

    ssl_certificate     /etc/letsencrypt/live/cfs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cfs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CFS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    limit_conn cfs_global 100;
    limit_conn cfs_per_ip 20;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=cfs_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:5080;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
